<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - 3A COMPANY S.A.C.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        
        <div class="auth-header">
            <div class="badge-company">
                <div class="badge-dot"></div>
                3A COMPANY S.A.C.
            </div>
            <h1>Sistema de Incidencias</h1>
            <p>Plataforma B2B de resolución y monitoreo operativo</p>
        </div>

        <div th:if="${param.error}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> Correo o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> Has cerrado sesión exitosamente.
        </div>
        <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <div class="input-wrapper">
                    <i class="far fa-envelope input-icon-left"></i>
                    <input type="email" name="username" class="form-control" placeholder="ejemplo@empresa.com" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon-left"></i>
                    <input type="password" name="password" id="passwordInput" class="form-control" placeholder="••••••••" required>
                    <!-- Llamada a la función unificada de auth.js -->
                    <button type="button" class="input-icon-right" onclick="togglePasswordVisibility('passwordInput', 'eyeIcon')">
                        <i class="far fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                INGRESAR <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer-link">
            ¿No tienes cuenta? <a th:href="@{/register}">Regístrate aquí</a>
        </div>

    </div>

    <div class="system-footer">
        <i class="fas fa-shield-alt"></i> Canal Oficial • 3A COMPANY S.A.C.
    </div>
</div>

<script th:src="@{/js/auth.js}"></script>

</body>
</html>
