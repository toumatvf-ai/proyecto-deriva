<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - 3A COMPANY S.A.C.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        
        <div class="auth-header">
            <div class="badge-company">
                <div class="badge-dot"></div>
                3A COMPANY S.A.C.
            </div>
            <h1>Sistema de Incidencias</h1>
            <p>Plataforma B2B de resolución y monitoreo operativo</p>
        </div>

        <div th:if="${errorMsg}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMsg}"></span>
        </div>

        <form th:action="@{/register/process}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>Nombres</label>
                    <div class="input-wrapper">
                        <i class="far fa-user input-icon-left"></i>
                        <input type="text" name="firstName" class="form-control" placeholder="Juan" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Apellidos</label>
                    <div class="input-wrapper">
                        <i class="far fa-user input-icon-left" style="opacity: 0;"></i>
                        <input type="text" name="lastName" class="form-control" placeholder="Pérez" style="padding-left: 14px;" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Correo Electrónico</label>
                <div class="input-wrapper">
                    <i class="far fa-envelope input-icon-left"></i>
                    <input type="email" name="email" class="form-control" placeholder="ejemplo@empresa.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Teléfono</label>
                <div class="input-wrapper">
                    <i class="fas fa-phone-alt input-icon-left"></i>
                    <input type="text" name="phone" class="form-control" placeholder="+51 999 999 999">
                </div>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon-left"></i>
                    <input type="password" name="password" id="passwordInputReg" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
                    <!-- Llamada a la función unificada de auth.js -->
                    <button type="button" class="input-icon-right" onclick="togglePasswordVisibility('passwordInputReg', 'eyeIconReg')">
                        <i class="far fa-eye" id="eyeIconReg"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                REGISTRARME <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer-link">
            ¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión aquí</a>
        </div>

    </div>

    <div class="system-footer">
        <i class="fas fa-shield-alt"></i> Canal Oficial • 3A COMPANY S.A.C.
    </div>
</div>

<script th:src="@{/js/auth.js}"></script>

</body>
</html>
