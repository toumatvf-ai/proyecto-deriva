<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Reclamo - 3A COMPANY S.A.C.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: topbar}"></div>

<div class="main-container" style="max-width: 850px;">
    
    <div style="margin-bottom: 20px;">
        <a th:href="@{/dashboard/client}" class="btn-action">
            <i class="fas fa-arrow-left"></i> Volver a Mis Reclamos
        </a>
    </div>

    <div class="page-header" style="margin-bottom: 20px;">
        <div>
            <h1>Registrar Nuevo Reclamo Corporativo</h1>
            <p>Completa la información requerida para enrutar tu solicitud de manera prioritaria.</p>
        </div>
    </div>

    <!-- Contenedor del Formulario Estilo Dashboard -->
    <div class="card-table" style="padding: 35px;">
        <form th:action="@{/incident/create}" method="post">
            
            <div class="form-group">
                <label>Empresa Afectada</label>
                <select id="companySelect" class="form-control" onchange="toggleNewCompanyFields()" required>
                    <option value="">-- Seleccione su empresa --</option>
                    <option th:each="company : ${companies}" 
                            th:value="${company.companyId}" 
                            th:text="${company.legalName}"></option>
                    <option value="NEW">+ Registrar Nueva Empresa</option>
                </select>
                <input type="hidden" name="companyId" id="realCompanyId">
            </div>

            <!-- Campos Dinámicos para Nueva Empresa -->
            <div id="newCompanyFields" style="display: none; background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 25px;">
                <div style="font-weight: 700; font-size: 0.9rem; color: #0f172a; margin-bottom: 15px;">
                    <i class="fas fa-building" style="color: var(--primary-green); margin-right: 6px;"></i> Datos de la Nueva Empresa
                </div>
                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 15px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>RUC (11 dígitos)</label>
                        <input type="text" name="companyRuc" id="companyRuc" class="form-control" maxlength="11" pattern="\d{11}" placeholder="Ej: 20123456789">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Razón Social</label>
                        <input type="text" name="companyName" id="companyName" class="form-control">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Título Breve de la Incidencia</label>
                <input type="text" name="title" class="form-control" placeholder="Ej: Retraso en despacho de suministros agroindustriales" required>
            </div>

            <div class="form-group">
                <label>Descripción Detallada</label>
                <textarea name="description" class="form-control" style="height: 120px; resize: vertical;" placeholder="Describe detalladamente lo sucedido (lote, guía de remisión, impacto, etc.)..." required></textarea>
            </div>

            <div class="form-group">
                <label>URL de Evidencia o Foto (Opcional)</label>
                <input type="url" name="photoUrl" class="form-control" placeholder="https://ejemplo.com/evidencia.jpg">
            </div>

            <div style="display: flex; gap: 15px; align-items: center; justify-content: flex-end; border-top: 1px solid var(--border-color); padding-top: 20px; margin-top: 10px;">
                <a th:href="@{/dashboard/client}" class="btn-action" style="padding: 12px 20px;">Cancelar</a>
                <button type="submit" class="btn-primary-action" style="padding: 12px 24px;">
                    <i class="fas fa-paper-plane"></i> Enviar Reclamo
                </button>
            </div>

        </form>
    </div>
</div>

<script>
    function toggleNewCompanyFields() {
        var select = document.getElementById('companySelect');
        var realId = document.getElementById('realCompanyId');
        var newFields = document.getElementById('newCompanyFields');
        var rucInput = document.getElementById('companyRuc');
        var nameInput = document.getElementById('companyName');
        
        if (select.value === 'NEW') {
            realId.value = '';
            newFields.style.display = 'block';
            rucInput.required = true;
            nameInput.required = true;
        } else {
            realId.value = select.value;
            newFields.style.display = 'none';
            rucInput.required = false;
            nameInput.required = false;
            rucInput.value = '';
            nameInput.value = '';
        }
    }
    
    window.onload = function() {
        var select = document.getElementById('companySelect');
        if (select.options.length === 2) {
            select.value = 'NEW';
            toggleNewCompanyFields();
        }
    };
</script>

</body>
</html>
