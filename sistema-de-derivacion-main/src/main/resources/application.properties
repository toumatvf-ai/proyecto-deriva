spring.application.name=deriva



# ==============================================================
# ARCHIVO DE CONFIGURACIÓN PRINCIPAL – 3A COMPANY S.A.C.
# Contiene credenciales de BD y configuración de Hibernate
# ==============================================================

# CONFIGURACIÓN DE CONEXIÓN A POSTGRESQL
spring.datasource.url=jdbc:postgresql://localhost:5432/deriva_db?timezone=America/Lima
spring.datasource.username=postgres
spring.datasource.password=CONTRASENA_AQUI

# CONFIGURACIÓN DE JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true